# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.11.0"
  python_check_max: "3.14"
  pytest_k: not ((test_main and test_lint) or test_validate_hook)

package:
  name: numpydoc
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/numpydoc/numpydoc-${{ version }}.tar.gz
  sha256: 26db0adaac8087e98da05c86b11198defd962aef7c21f4dffd2703c8c6eb4187

build:
  number: 1
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check --check-build-dependencies
  python:
    entry_points:
      - numpydoc = numpydoc.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}
    - sphinx >=6

tests:
  - python:
      imports: numpydoc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -m numpydoc --help
      - numpydoc --help
      - python -c "v = __import__('importlib.metadata').version('numpydoc'); print(v); assert v == '${{ version }}'"
  - requirements:
      run:
        - matplotlib-base
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      - coverage run --source=numpydoc --branch -m pytest -vv --tb=long --color=yes --pyargs numpydoc -k "${{ pytest_k }}"
      - coverage report --show-missing --skip-covered --fail-under=84

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Sphinx extension to support docstrings in Numpy format
  homepage: https://pypi.org/project/numpydoc
  repository: https://github.com/numpy/numpydoc
  documentation: https://numpydoc.readthedocs.io

extra:
  recipe-maintainers:
    - jschueller
    - scopatz
    - bollwyvl
